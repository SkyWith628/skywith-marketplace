<!--
  tistory.html — 티스토리 HTML 모드 붙여넣기용 다크 전용 스켈레톤.
  사용법: {{CONTENT}} 자리에 본문 HTML(h2/p/pre/table/div.box 등)을 넣는다.
  - 모든 스타일이 .rp 로 스코프됨 → 블로그 테마와 충돌 없음
  - .rp 배경은 transparent → 블로그(다크) 배경을 그대로 사용, "카드 안 카드" 이중배경 방지
  - 코드블록은 테두리 없이 단일 배경
  콜아웃: <div class="box note|tip|warn|use">…</div>  (use는 🔗 어디에 쓰나)
  구문강조 span: cm(주석) st(문자열) nu(숫자) fn(함수) kw(키워드)
  개념 지도: div.map > (c>mb / ar / row>cell>q,s / ft)
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
.rp{max-width:760px;margin:0 auto;padding:4px 0 40px;background:transparent;color:#e6e7ea;
 font-family:"Pretendard","Pretendard Variable",system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
 font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased;box-sizing:border-box;}
.rp *{box-sizing:border-box;}
.rp h2{font-size:1.4rem;line-height:1.35;margin:48px 0 14px;padding-bottom:8px;border-bottom:1px solid #2c2e35;color:#f4f5f7;scroll-margin-top:16px;}
.rp p{margin:0 0 1.15em;}
.rp em{color:#cdd0d6;font-style:italic;}
.rp a{color:#7da9ff;text-decoration:none;border-bottom:1px solid rgba(125,169,255,.4);}
.rp ul{padding-left:1.3em;margin:0 0 1.15em;}
.rp li{margin:.35em 0;}
.rp .next{color:#9aa0ab;font-style:italic;margin:0 0 1.15em;}
.rp code{font-family:"D2Coding",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85em;background:#262932;padding:2px 6px;border-radius:5px;color:#e9d9b0;}
.rp pre{background:#0f1013;color:#e6e6e6;font-family:"D2Coding",ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.7;padding:16px 18px;border-radius:10px;overflow-x:auto;margin:0 0 1.4em;border:0;}
.rp pre code{background:none;padding:0;font-size:inherit;color:inherit;}
.rp .cm{color:#7f8796;} .rp .st{color:#98c379;} .rp .nu{color:#d19a66;} .rp .fn{color:#61afef;} .rp .kw{color:#c586c0;}
.rp .ts{overflow-x:auto;margin:0 0 1.4em;}
.rp table{border-collapse:collapse;width:100%;font-size:.92rem;}
.rp th,.rp td{text-align:left;padding:8px 12px;border-bottom:1px solid #2c2e35;vertical-align:top;}
.rp thead th{border-bottom:2px solid #3a3d45;font-weight:700;white-space:nowrap;color:#f4f5f7;}
.rp td code,.rp th code{white-space:nowrap;}
.rp .box{border-radius:10px;padding:13px 17px;margin:0 0 1.4em;border:1px solid #2c2e35;}
.rp .box p:last-child{margin-bottom:0;}
.rp .note{background:#151d2b;border-color:#24344d;} .rp .tip{background:#132318;border-color:#245036;}
.rp .warn{background:#241f12;border-color:#4a3d1c;} .rp .use{background:#1d1830;border-color:#3a2f5c;}
.rp .use .h{font-weight:700;color:#b794f6;}
.rp hr{border:0;border-top:1px solid #2c2e35;margin:40px 0;}
.rp .src{color:#9aa0ab;font-size:.9em;}
.rp .toc{background:#1e2026;border:1px solid #2c2e35;border-radius:12px;padding:14px 20px;margin:0 0 34px;font-size:.93rem;}
.rp .toc .t{font-weight:700;font-size:.82rem;color:#9aa0ab;letter-spacing:.03em;margin-bottom:6px;}
.rp .toc ol{margin:0;padding-left:1.4em;}
.rp .toc li{margin:3px 0;} .rp .toc a{color:#d7dae0;border:0;} .rp .toc a:hover{color:#7da9ff;}
.rp .map{border:1px solid #2c2e35;border-radius:14px;padding:20px 16px;margin:0 0 18px;background:#1e2026;}
.rp .map .c{text-align:center;margin-bottom:5px;}
.rp .map .mb{display:inline-block;background:#26282f;border:1px solid #363943;border-radius:9px;padding:7px 13px;font-size:.9rem;}
.rp .map .mb b{color:#7da9ff;}
.rp .map .ar{text-align:center;color:#9aa0ab;font-size:.84rem;margin:4px 0;}
.rp .map .row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:6px 0;}
.rp .map .cell{background:#26282f;border:1px solid #363943;border-radius:9px;padding:9px 7px;text-align:center;font-size:.8rem;line-height:1.45;}
.rp .map .cell .q{display:block;color:#7da9ff;font-weight:700;margin-bottom:2px;}
.rp .map .cell .s{display:block;font-family:"D2Coding",monospace;font-size:.76rem;color:#9aa0ab;margin-top:3px;}
.rp .map .ft{text-align:center;font-size:.85rem;color:#9aa0ab;margin-top:8px;}
@media(max-width:520px){.rp .map .row{grid-template-columns:repeat(2,1fr);}}
</style>

<div class="rp">
{{CONTENT}}
</div>
