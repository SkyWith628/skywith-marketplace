<meta charset="utf-8">
<title>에이전트 관제실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="agent-ops-version" content="7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: 터미널 관제판 — 왼쪽 어드바이저 레일, 가운데 위→아래 흐름(리드 → 팀 밴드 → 리드 복귀), 오른쪽 결과, 아래 넓은 세션 로그 */
:root{
  color-scheme: dark;
  --bg:#0b0e13; --panel:#10141b; --panel-2:#161b24; --line:#252c38; --line-2:#343d4d; --dot:#181d26;
  --fg:#dfe5ef; --mute:#8d97a9; --faint:#5b6579;
  --lead:#ff8f5a; --worker:#62b2ff; --advisor:#b79cff; --fork:#93dd6a; --session:#6fd6e6;
  --ok:#3fd0a0; --warn:#f2c14e; --err:#ff5f6d;
  --f-mono:"JetBrains Mono","IBM Plex Sans KR",ui-monospace,Consolas,"Malgun Gothic",monospace;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:12.5px/1.5 var(--f-mono);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--worker);outline-offset:2px}
[data-role=lead]{--c:var(--lead)} [data-role=worker]{--c:var(--worker)} [data-role=advisor]{--c:var(--advisor)}
[data-role=fork]{--c:var(--fork)} [data-role=session]{--c:var(--session)}

/* Named areas: hiding the note must not shift the board into an auto-height row. */
.app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) var(--bh,200px) auto;
  grid-template-areas:"top" "legend" "note" "board" "bottom" "status";gap:8px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{grid-area:top} .legend{grid-area:legend} .note{grid-area:note} .board{grid-area:board} .bottom{grid-area:bottom} .statusline{grid-area:status}
/* ── header ── */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;min-width:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.brand{font:700 12px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.brand em{font-style:normal;color:var(--lead)}
.run{display:flex;flex-direction:column;min-width:0;flex:1 1 240px}
.run-title{font:600 14px/1.35 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-goal{font:400 11.5px/1.4 var(--f-body);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px;padding:2px 14px;border-left:1px solid var(--line);min-width:72px}
.stat b{font:600 14px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:10px;color:var(--faint);letter-spacing:.06em}
.src{display:flex;align-items:center;gap:8px}
.badge{font:700 10px/1 var(--f-mono);letter-spacing:.14em;padding:5px 7px;border:1px solid currentColor;white-space:nowrap}
.badge.live{color:var(--ok)} .badge.demo{color:var(--warn)}
.badge.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;animation:blink 1.6s infinite}
#run-select{background:var(--panel);border:1px solid var(--line);padding:4px 6px;max-width:200px;font-size:11px}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:11px;color:var(--mute);min-height:16px}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend span::before{content:"";width:8px;height:8px;background:var(--c)}
.note{margin:0;font-size:11px;color:var(--warn)}

/* ── board ── */
.board{position:relative;display:grid;grid-template-columns:232px minmax(0,1fr) var(--sw,330px);gap:10px;min-height:0}
.board.no-rail{grid-template-columns:minmax(0,1fr) var(--sw,330px)}
.board.no-rail .rail{display:none}
.rail,.flow,.side,.bottom{border:1px solid var(--line);background:var(--panel);min-height:0}
.rail{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
/* No text highlighting or native element dragging while using the board; content meant to be copied opts back in below. */
.app{-webkit-user-select:none;user-select:none}
.app img,.app svg,.app a{-webkit-user-drag:none}
.lg-x,.res-b,.det-txt,.run-title,.run-goal{-webkit-user-select:text;user-select:text}
.flow{position:relative;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px);background-size:20px 20px}
.flow.panning{cursor:grabbing}
.flow-in{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;padding:18px 18px 22px;display:flex;flex-direction:column;align-items:stretch;gap:34px}

/* view controls */
.vctl{position:absolute;bottom:8px;right:8px;z-index:6;display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line-2);cursor:default}
.vctl button{min-width:30px;height:30px;padding:0 8px;background:none;border:0;border-left:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--mute);white-space:nowrap}
.vctl button:first-child{border-left:0}
.vctl button:hover{color:var(--fg);background:var(--panel-2)}
.vctl button[aria-pressed=true]{color:var(--lead)}
#z-pct{min-width:54px;font-variant-numeric:tabular-nums}
.vhint{position:absolute;left:10px;bottom:8px;z-index:6;font-size:10.5px;color:var(--faint);pointer-events:none}

/* panel sizers */
.sizer-x{position:absolute;top:0;bottom:0;left:0;width:8px;cursor:col-resize;z-index:7;touch-action:none}
.sizer-y{position:absolute;left:0;right:0;top:0;height:7px;cursor:row-resize;z-index:7;touch-action:none}
.sizer-x::after,.sizer-y::after{content:"";position:absolute;background:var(--line-2);opacity:0;transition:opacity .2s}
.sizer-x::after{top:40%;bottom:40%;left:3px;width:2px} .sizer-y::after{left:45%;right:45%;top:3px;height:2px}
.sizer-x:hover::after,.sizer-y:hover::after,.sizer-x:focus-visible::after,.sizer-y:focus-visible::after{opacity:1;background:var(--lead)}
.side,.bottom{position:relative}

/* focus mode: flow takes the whole board */
.app.focus{grid-template-rows:auto auto auto minmax(0,1fr) 0px auto}
.app.focus .bottom,.app.focus .rail,.app.focus .side{display:none}
.app.focus .board,.app.focus .board.no-rail{grid-template-columns:minmax(0,1fr)}
svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.ln{fill:none;stroke:var(--line-2);stroke-width:1.2}
.ln.on{stroke:var(--lc);stroke-opacity:.85;stroke-dasharray:3 6;animation:flow .9s linear infinite}
.ln.done{stroke:var(--ok);stroke-opacity:.45}
.ln.err{stroke:var(--err);stroke-opacity:.8;stroke-dasharray:2 4}
.jn{fill:var(--bg);stroke:var(--line-2);stroke-width:1.2}
.jn.on{stroke:var(--lc);fill:var(--lc)}
.jn.done{stroke:var(--ok)}

.roots{display:flex;justify-content:center;flex-wrap:wrap;gap:16px}
.band{display:flex;flex-direction:column;gap:20px}
.band-h{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--mute);flex-wrap:wrap;text-align:center}
.band-h b{color:var(--fg);font-weight:600;letter-spacing:.04em}
.band-h b i{font-style:normal;color:var(--c,var(--worker))}
.band-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.band-g.few{grid-template-columns:repeat(auto-fit,minmax(196px,250px));justify-content:center}
.join{align-self:center;min-width:min(360px,100%);padding:9px 16px;border:1px solid color-mix(in srgb,var(--lead) 60%,var(--line));background:var(--panel);text-align:center;font-size:12px}
.join b{color:var(--lead)}
.join span{color:var(--mute)}
.join[data-st=ready]{box-shadow:0 0 22px -8px var(--lead)}

/* agent card */
.card{position:relative;display:flex;flex-direction:column;gap:5px;padding:9px 11px;background:var(--panel);
  border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));cursor:pointer;min-width:0;transition:border-color .3s,box-shadow .3s,opacity .3s}
.card.lead{width:min(440px,100%);text-align:center;align-items:stretch;padding:11px 16px}
.card[data-st=working],.card[data-st=thinking]{box-shadow:0 0 22px -10px var(--c)}
.card[data-st=queued]{opacity:.6}
.card[data-st=done]{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.card[data-st=error]{border-color:var(--err);box-shadow:0 0 20px -8px var(--err)}
.card.sel{outline:2px solid var(--c);outline-offset:2px}
.card.hit{animation:hit .5s ease-out}
.card.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
.c-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.card.lead .c-head{justify-content:center}
.c-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-model{color:var(--c);white-space:nowrap;font-size:11px}
.card.lead .c-name{color:var(--c)}
.c-task{color:var(--mute);font:400 11.5px/1.4 var(--f-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-prog{display:flex;align-items:center;gap:8px}
.bar{position:relative;flex:1;height:7px;background:var(--panel-2);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--c);transition:width .35s ease-out}
.bar>i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.card[data-st=working] .bar,.card[data-st=thinking] .bar,.card[data-st=waiting] .bar{background-image:repeating-linear-gradient(-45deg,transparent 0 4px,color-mix(in srgb,var(--c) 14%,transparent) 4px 8px);background-size:22px 22px;animation:stripes 1.2s linear infinite}
.card[data-st=working] .bar>i,.card[data-st=thinking] .bar>i,.card[data-st=waiting] .bar>i{background-image:repeating-linear-gradient(-45deg,transparent 0 5px,rgba(255,255,255,.16) 5px 10px);background-size:28px 28px;animation:stripes 0.8s linear infinite}

.card[data-st=done] .bar>i{background:var(--ok)} .card[data-st=error] .bar>i{background:var(--err)}
.card[data-st=working] .bar>i::after,.card[data-st=thinking] .bar>i::after,.card[data-st=waiting] .bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);background-size:50px 100%;background-repeat:no-repeat;animation:sweep 1.2s linear infinite}
.bar.indet>i{width:34%!important;background:color-mix(in srgb,var(--c) 70%,transparent);animation:indet 1.4s ease-in-out infinite}
.c-pct{min-width:40px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
.c-now{display:flex;align-items:center;gap:2px;white-space:nowrap;overflow:hidden;min-width:0;font-size:11px}
.card.lead .c-now{justify-content:center}
.c-now::before{content:"›";color:var(--c);margin-right:5px}
.c-now-t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.caret{width:6px;height:12px;background:var(--c);flex:none;opacity:0}
.card[data-st=working] .caret,.card[data-st=thinking] .caret{opacity:1;animation:blink 1s steps(1) infinite}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--faint);font-size:10.5px;font-variant-numeric:tabular-nums}
.c-foot span{white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:10.5px;white-space:nowrap;color:var(--pc,var(--faint))}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
[data-st=working] .pill,.pill[data-st=working]{--pc:var(--c,var(--worker))}
[data-st=thinking] .pill,.pill[data-st=thinking]{--pc:var(--c,var(--advisor))}
[data-st=waiting] .pill,.pill[data-st=waiting]{--pc:var(--warn)}
[data-st=done] .pill,.pill[data-st=done]{--pc:var(--ok)}
[data-st=error] .pill,.pill[data-st=error]{--pc:var(--err)}
[data-st=working] .pill i,.pill[data-st=working] i{animation:pulse 1.2s infinite}
[data-st=thinking] .pill i,.pill[data-st=thinking] i{animation:blink .7s infinite}
[data-st=waiting] .pill i,.pill[data-st=waiting] i{background:transparent;border:1.5px solid currentColor}

/* advisor rail */
.adv{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));cursor:pointer}
.adv.sel{outline:2px solid var(--c);outline-offset:2px}
.adv.hit{animation:hit .5s ease-out}
.adv[data-st=thinking],.adv[data-st=working]{box-shadow:0 0 22px -10px var(--c)}
.adv-h{text-align:center}
.adv-h b{display:block;color:var(--c);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.adv-h span{font-size:11px;color:var(--mute)}
.adv-task{margin:0;font:400 11px/1.45 var(--f-body);color:var(--mute)}
.adv-log{list-style:none;margin:0;padding:0 0 0 10px;border-left:1px dashed var(--line-2);display:flex;flex-direction:column;gap:6px}
.adv-log li{font:400 11px/1.4 var(--f-body);overflow-wrap:anywhere}
.adv-log li.q{color:var(--mute)} .adv-log li.q::before{content:"◇ ";color:var(--faint)}
.adv-log li.a{color:var(--fg)} .adv-log li.a::before{content:"» ";color:var(--c);font-weight:700}
.adv-st{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:0;font-size:11px}
.adv-st dt{color:var(--faint)} .adv-st dd{margin:0;text-align:right;color:var(--c);font-variant-numeric:tabular-nums}
.adv-empty{color:var(--faint);font-size:11px}

/* side: results / agent detail */
.side{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:8px 6px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--mute)}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--lead)}
.tabs button span{font-weight:400;color:var(--faint);margin-left:4px}
.pane{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;overscroll-behavior:contain}
.empty{padding:18px 14px;color:var(--faint);font:400 12px/1.6 var(--f-body)}

.res{border-bottom:1px solid var(--line)}
.res summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 8px;padding:8px 12px;cursor:pointer;list-style:none}
.res summary::-webkit-details-marker{display:none}
.res summary:hover{background:var(--panel-2)}
.res-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.res[data-s=warn] .res-dot{background:var(--warn)} .res[data-s=fail] .res-dot{background:var(--err)}
.res-t{font:600 12px/1.4 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-m{font-size:10.5px;color:var(--faint);white-space:nowrap}
.res-pv{grid-column:2/4;font:400 11px/1.4 var(--f-body);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res[open] .res-pv{display:none}
.res-b{padding:0 12px 10px 27px}
.res-b p{margin:0;font:400 12px/1.55 var(--f-body);color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.res-b ul{margin:6px 0 0;padding:0;list-style:none;font-size:11px;color:var(--worker);overflow-wrap:anywhere}
.res-b li::before{content:"▸ ";color:var(--faint)}

.det{padding:12px 14px}
.det-h{display:flex;align-items:center;gap:8px}
.det-h b{font-size:14px;color:var(--c)}
.det-back{margin-left:auto;background:none;border:1px solid var(--line);padding:3px 8px;cursor:pointer;font-size:11px;color:var(--mute)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;margin:10px 0;font-size:11.5px}
.kv dt{color:var(--faint)} .kv dd{margin:0;overflow-wrap:anywhere}
.det-sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:12px 0 4px}
.det-txt{margin:0 0 5px;font:400 12px/1.5 var(--f-body);overflow-wrap:anywhere}
.ag{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;padding:8px 12px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.ag:hover{background:var(--panel-2)}
.ag .sq{width:8px;height:8px;background:var(--c)}
.ag-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}

/* bottom: session log / timeline */
.bottom{display:flex;flex-direction:column;overflow:hidden}
.bottom .tabs button{flex:none;padding:7px 14px}
.log{flex:1;overflow-y:auto;min-height:0;padding:4px 0}
.lg{display:grid;grid-template-columns:62px minmax(120px,190px) minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:2px 12px;font-size:11.5px;cursor:pointer}
.lg:hover{background:var(--panel-2)}
.lg.new{animation:flash 1.2s ease-out}
.lg.dim{opacity:.3}
.lg-t{color:var(--faint);font-variant-numeric:tabular-nums}
.lg-w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-body)}
.lg.open .lg-x{white-space:normal;overflow-wrap:anywhere}
.lg-k{font-size:10px;color:var(--k);letter-spacing:.06em;white-space:nowrap}
.tag{font-weight:700;color:var(--c,var(--mute))}
.arr{color:var(--faint);margin:0 4px}
.k-msg{--k:var(--worker)} .k-spawn{--k:var(--advisor)} .k-result{--k:var(--ok)} .k-error{--k:var(--err)} .k-tool{--k:var(--mute)} .k-note{--k:var(--faint)}
.tl{flex:1;overflow:auto;min-height:0;padding:6px 12px 8px}
.lane{display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;gap:10px;height:20px;cursor:pointer}
.lane-l{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.lane-t{position:relative;height:100%;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:var(--step,10%) 100%}
.lane-bar{position:absolute;top:5px;height:10px;background:color-mix(in srgb,var(--c) 35%,transparent);border:1px solid color-mix(in srgb,var(--c) 70%,transparent)}
.lane[data-st=working] .lane-bar,.lane[data-st=thinking] .lane-bar{background-image:repeating-linear-gradient(-45deg,transparent 0 4px,color-mix(in srgb,var(--c) 35%,transparent) 4px 8px);background-size:22px 22px;animation:stripes 1s linear infinite}
.lane[data-st=done] .lane-bar{background:color-mix(in srgb,var(--ok) 20%,transparent);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.tick{position:absolute;top:3px;width:3px;height:14px;background:var(--k);transform:translateX(-1px)}
.tl-axis{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:10px;color:var(--faint);height:14px;margin-bottom:4px}
.tl-axis div{position:relative}
#tl-axis span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}

.statusline{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusline .p{color:var(--ok)} .statusline b{color:var(--worker);font-weight:600} .statusline i{font-style:normal;color:var(--advisor)}

/* fx overlay (packets, bubbles) */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.fx svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pk-path{fill:none;stroke:var(--k);stroke-width:2;stroke-opacity:.35;transition:stroke-opacity .5s}
.pk-path.fade{stroke-opacity:0}
.pk{fill:var(--k);stroke:var(--bg);stroke-width:2}
/* speech bubble: one size for every agent — the speaker's width, two lines max, attached to the speaker */
.card.talking,.adv.talking{z-index:4}
.adv{position:relative}
.bubble{position:absolute;left:0;right:0;bottom:calc(100% + 7px);z-index:5;padding:6px 9px;background:var(--panel-2);border:1px solid var(--k);
  color:var(--fg);text-align:left;pointer-events:none;box-shadow:0 6px 18px -8px rgba(0,0,0,.7);animation:pop .22s cubic-bezier(.2,.8,.2,1);transition:opacity .35s}
.bubble.below{bottom:auto;top:calc(100% + 7px)}
.bubble.inside{bottom:auto;top:4px;left:4px;right:4px}
.bubble::after{content:"";position:absolute;left:16px;bottom:-5px;width:8px;height:8px;background:var(--panel-2);border-right:1px solid var(--k);border-bottom:1px solid var(--k);transform:rotate(45deg)}
.bubble.below::after{bottom:auto;top:-5px;transform:rotate(-135deg)}
.bubble.inside::after{display:none}
.bubble-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font:400 11px/1.45 var(--f-body)}
.bubble-k{display:block;font:600 9.5px/1.2 var(--f-mono);letter-spacing:.08em;color:var(--k);margin-bottom:2px}
.bubble.out{opacity:0}

@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes sweep{from{background-position:-50px 0}to{background-position:300px 0}}
@keyframes indet{0%{left:-34%}100%{left:100%}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes hit{0%,100%{transform:none}35%{transform:scale(1.03)}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
@keyframes flash{from{background:color-mix(in srgb,var(--k) 22%,transparent)}to{background:transparent}}
@keyframes stripes{to{background-position:28px 0}}

@media (max-width:1000px){
  html,body{height:auto}
  .app{height:auto;grid-template-rows:none}
  .board,.board.no-rail{grid-template-columns:minmax(0,1fr)}
  .rail{max-height:none;flex-direction:row;overflow-x:auto}
  .adv{min-width:240px;flex:1}
  .flow{height:480px}
  .app.focus .flow{height:calc(100vh - 150px)}
  .sizer-x,.sizer-y,.vhint{display:none}
  .side{height:380px}
  .bottom{height:300px}
  .stat{flex:1 1 30%;min-width:0;padding:2px 8px}
  .lg{grid-template-columns:54px minmax(0,1fr) auto;gap:2px 8px}
  .lg-x{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = String(text); return n; };
const NS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const str = (v) => typeof v === 'string' ? v : '';
const arr = (v) => Array.isArray(v) ? v : [];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtK = (n) => { n = +n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n)); };
const pad2 = (v) => String(v).padStart(2, '0');
const fmtDur = (ms) => { if (!(ms >= 0)) return '—'; const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + pad2(m) : m) + ':' + pad2(s % 60); };
const fmtClock = (t) => { const d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); };

const ROLES = ['lead', 'worker', 'advisor', 'fork', 'session'];
const ROLE_EN = { lead: 'lead', worker: 'swarm', advisor: 'advisor', fork: 'forks', session: 'session' };
const ST_KO = { queued: '대기', thinking: '생각 중', working: '작업 중', waiting: '응답 대기', done: '완료', error: '오류' };
const RUN_KO = { running: '진행 중', done: '완료', error: '오류', paused: '일시정지' };
const RUN_ST = { running: 'working', done: 'done', error: 'error', paused: 'waiting' };
const KIND_KO = { spawn: '지시', msg: '메시지', tool: '도구', result: '결과', error: '오류', note: '메모' };
const ACTIVE = new Set(['thinking', 'working', 'waiting']);
// Own-key lookup only: plain-object maps would otherwise accept "constructor", "toString", …
const has = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);
const MAX_EVENTS = 2000, MAX_LOG = 300, MAX_FLUSHES = 1000, MAX_FX = 24;

/* ───────── state ───────── */
let S = fresh();
function fresh() { return { run: {}, agents: new Map(), seq: 0, seqs: new Set(), events: [], results: new Map(), teamOrder: [] }; }
let sel = null, sideTab = 'res', bottomTab = 'log';
const openResults = new Set();

function upsertAgent(p, seq, t) {
  if (!p || typeof p.id !== 'string' || !p.id) return;
  let a = S.agents.get(p.id);
  if (!a) {
    a = { id: p.id, name: p.id, role: 'worker', model: '', team: '', parent: '', status: 'queued', progress: 0, task: '', now: '', tokens: 0, tools: 0, firstSeq: seq, endSeq: null, since: null, until: null, fresh: true };
    S.agents.set(p.id, a);
  }
  for (const k of ['name', 'model', 'team', 'parent', 'task', 'now']) if (typeof p[k] === 'string') a[k] = p[k];
  if (typeof p.role === 'string') a.role = ROLES.includes(p.role) ? p.role : 'worker';
  const wasActive = ACTIVE.has(a.status);
  if (has(ST_KO, p.status)) a.status = p.status;
  for (const k of ['progress', 'tokens', 'tools']) if (Number.isFinite(p[k])) a[k] = p[k];
  if (Number.isFinite(p.progress) && p.progress > 0) a.progAt = t != null ? t : Date.now();
  if (a.status === 'done' && !Number.isFinite(p.progress)) a.progress = 100;
  a.progress = clamp(a.progress, 0, 100);
  if (ACTIVE.has(a.status) && !wasActive && t != null && a.since == null) a.since = t;
  if (a.status === 'done' || a.status === 'error') { if (a.endSeq == null) a.endSeq = seq; if (a.until == null && t != null) a.until = t; }
  else { a.endSeq = null; a.until = null; }
  if (a.team && !S.teamOrder.includes(a.team)) S.teamOrder.push(a.team);
}

/* Fold one flush into state. `live` stamps arrival time when the flush has no `at`. */
function ingest(f, live) {
  if (!f || typeof f !== 'object') return null;
  const seq = Number.isFinite(f.seq) ? f.seq : S.seq + 1;
  if (S.seqs.has(seq)) return null;
  S.seqs.add(seq); S.seq = Math.max(S.seq, seq);
  const t = Number.isFinite(f.at) ? f.at : (live ? Date.now() : null);
  if (f.run && typeof f.run === 'object') {
    for (const k of ['title', 'goal', 'summary']) if (typeof f.run[k] === 'string') S.run[k] = f.run[k];
    if (has(RUN_KO, f.run.status)) S.run.status = f.run.status;
    for (const k of ['startedAt', 'endedAt']) if (Number.isFinite(f.run[k])) S.run[k] = f.run[k];
  }
  if (!Number.isFinite(S.run.startedAt) && t != null) S.run.startedAt = t;
  for (const p of arr(f.agents)) upsertAgent(p, seq, t);
  for (const r of arr(f.results)) if (r && typeof r.id === 'string') S.results.set(r.id, { id: r.id, agent: str(r.agent), title: str(r.title) || r.id, body: str(r.body), status: ['ok', 'warn', 'fail'].includes(r.status) ? r.status : 'ok', files: arr(r.files).filter(x => typeof x === 'string'), seq });
  return arr(f.events).filter(e => e && typeof e === 'object').map(e => ({ from: str(e.from), to: str(e.to), kind: has(KIND_KO, e.kind) ? e.kind : 'note', text: str(e.text), seq, t }));
}
function pushEvent(e) { S.events.push(e); if (S.events.length > MAX_EVENTS) S.events.splice(0, S.events.length - MAX_EVENTS); }

/* Live path: state lands at once; only the packets/bubbles are paced. */
function receive(f, live) {
  const evs = ingest(f, live);
  if (!evs) return;
  if (current) for (const b of beatDocs) applyBeat(b, false); // beats that beat the spawn flush here
  const stick = logAtBottom();
  for (const e of evs) { pushEvent(e); logRow(e, live); }
  renderAll();
  if (stick) logEl.scrollTop = logEl.scrollHeight;
  if (live) for (const e of evs) queueFx(e);
}
/* History: fold every flush first, render once, no effects. */
function loadHistory(docs) {
  reset();
  mergeRunMeta(currentMeta);
  for (const f of docs) { const evs = ingest(f, false); if (evs) for (const e of evs) pushEvent(e); }
  if (current) reapplyBeats();
  for (const e of S.events.slice(-MAX_LOG)) logRow(e, false);
  renderAll();
  logEl.scrollTop = logEl.scrollHeight;
}

/* ───────── structure: roots → bands → join ───────── */
function depthOf(a, seen = new Set()) {
  const p = S.agents.get(a.parent);
  if (!p || p.role === 'advisor' || seen.has(a.id)) return 0;
  seen.add(a.id); return 1 + depthOf(p, seen);
}
function structure() {
  const advisors = [], roots = [], bands = new Map();
  for (const a of S.agents.values()) {
    if (a.role === 'advisor') { advisors.push(a); continue; }
    const d = depthOf(a);
    if (!d) { roots.push(a); continue; }
    const key = d + '|' + (a.team || '↳' + a.parent);
    if (!bands.has(key)) bands.set(key, { key, depth: d, team: a.team, parents: new Set(), items: [] });
    const b = bands.get(key); b.items.push(a); b.parents.add(a.parent);
  }
  return { advisors, roots, bands: [...bands.values()].sort((x, y) => x.depth - y.depth) };
}

/* ───────── rendering: board ───────── */
const board = $('#board'), rail = $('#rail'), flow = $('#flow'), flowIn = $('#flow-in'), links = $('#links');
const fxSvg = $('#fx-svg'), fxLayer = $('#fx'), logEl = $('#log');
const els = new Map();       // agent id -> element (card or advisor panel)
let bandEls = [], joinEl = null, structSig = '', ST = { advisors: [], roots: [], bands: [] };

function makeCard(a) {
  const n = el('article', 'card');
  n.dataset.id = a.id; n.tabIndex = 0; n.setAttribute('role', 'button');
  const head = el('div', 'c-head'); head.append(el('span', 'c-name'), el('span', 'c-model'));
  const prog = el('div', 'c-prog'); const bar = el('div', 'bar'); bar.append(el('i')); prog.append(bar, el('span', 'c-pct'));
  const now = el('div', 'c-now'); now.append(el('span', 'c-now-t'), el('span', 'caret'));
  const foot = el('div', 'c-foot'); const pill = el('span', 'pill'); pill.append(el('i'), el('span', 'pill-t')); foot.append(pill, el('span', 'c-time'), el('span', 'c-stats'));
  n.append(head, el('div', 'c-task'), prog, now, foot);
  n.addEventListener('click', () => { if (!suppressClick) select(a.id); });
  n.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(a.id); } });
  return n;
}
function makeAdv(a) {
  const n = el('article', 'adv');
  n.dataset.id = a.id; n.tabIndex = 0; n.setAttribute('role', 'button');
  const h = el('header', 'adv-h'); h.append(el('b'), el('span'));
  const st = el('dl', 'adv-st');
  n.append(h, el('p', 'adv-task'), el('ol', 'adv-log'), st, el('div', 'c-now'));
  n.querySelector('.c-now').append(el('span', 'c-now-t'));
  n.addEventListener('click', () => select(a.id));
  n.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(a.id); } });
  return n;
}
function buildStructure() {
  ST = structure();
  const sig = JSON.stringify([ST.advisors.map(a => a.id), ST.roots.map(a => a.id), ST.bands.map(b => [b.key, b.items.map(a => a.id)])]);
  if (sig === structSig) return;
  structSig = sig;
  // keep existing elements (animation state), re-home them
  const take = (a, maker) => { let n = els.get(a.id); const wrongKind = n && (maker === makeAdv) !== n.classList.contains('adv'); if (!n || wrongKind) { n = maker(a); els.set(a.id, n); } return n; };
  rail.replaceChildren(...ST.advisors.map(a => take(a, makeAdv)));
  if (!ST.advisors.length) rail.append(el('div', 'adv-empty', '어드바이저 없음'));
  board.classList.toggle('no-rail', !ST.advisors.length);
  for (const c of [...flowIn.children]) if (c !== links) c.remove();
  const roots = el('div', 'roots');
  for (const a of ST.roots) { const n = take(a, makeCard); n.classList.toggle('lead', a.role === 'lead'); roots.append(n); }
  flowIn.append(roots);
  bandEls = ST.bands.map(b => {
    const sec = el('section', 'band'); sec.dataset.key = b.key;
    const h = el('div', 'band-h'); h.append(el('b'), el('span'));
    const g = el('div', 'band-g' + (b.items.length < 3 ? ' few' : ''));
    for (const a of b.items) { const n = take(a, makeCard); n.classList.remove('lead'); g.append(n); }
    sec.append(h, g); flowIn.append(sec);
    return { b, sec, h };
  });
  joinEl = null;
  if (ST.bands.length && ST.roots.length) { joinEl = el('div', 'join'); flowIn.append(joinEl); }
  if (!ST.roots.length && !ST.bands.length) flowIn.append(el('div', 'empty', '작업이 시작되면 리드가 맨 위에, 리드가 맡긴 팀이 그 아래 줄에, 결과가 리드로 돌아오는 지점이 맨 아래에 그려집니다.'));
  for (const [id, n] of els) if (!S.agents.has(id)) els.delete(id);
}
function updateCard(a) {
  const n = els.get(a.id); if (!n) return;
  n.dataset.role = a.role; n.dataset.st = a.status;
  n.classList.toggle('sel', sel === a.id);
  if (a.fresh) { a.fresh = false; if (!reduced) { n.classList.add('enter'); setTimeout(() => n.classList.remove('enter'), 480); } }
  if (n.classList.contains('adv')) return updateAdv(a, n);
  n.querySelector('.c-name').textContent = a.role === 'lead' ? `${a.model || a.name} · ${a.name}` : a.name;
  n.querySelector('.c-model').textContent = a.role === 'lead' ? '' : a.model;
  n.querySelector('.c-task').textContent = a.task || ' ';
  const pr = paintProgress(a, n);
  n.querySelector('.c-now-t').textContent = a.now || (a.status === 'done' ? '완료' : '…');
  n.querySelector('.pill-t').textContent = ST_KO[a.status];
  n.querySelector('.c-stats').textContent = `${fmtK(a.tokens)} tok · ${a.tools} tools`;
  n.querySelector('.c-time').textContent = elapsedOf(a);
  n.setAttribute('aria-label', `${a.name}, ${ST_KO[a.status]}, ${Math.round(pr.pct)}%`);
}
function updateAdv(a, n) {
  n.querySelector('.adv-h b').textContent = a.model || a.name;
  n.querySelector('.adv-h span').textContent = `${a.name} · ${ACTIVE.has(a.status) ? 'on call' : ST_KO[a.status]}`;
  n.querySelector('.adv-task').textContent = a.task;
  const log = n.querySelector('.adv-log'); log.replaceChildren();
  const evs = S.events.filter(e => (e.to === a.id || e.from === a.id) && e.kind !== 'tool').slice(-8);
  for (const e of evs) log.append(el('li', e.from === a.id ? 'a' : 'q', e.text));
  if (!evs.length) log.append(el('li', 'q', '아직 요청 없음'));
  const st = n.querySelector('.adv-st'); st.replaceChildren();
  const calls = S.events.filter(e => e.to === a.id && e.kind !== 'tool').length;
  for (const [k, v] of [['calls', calls], ['tokens read', fmtK(a.tokens)], ['elapsed', elapsedOf(a)]]) st.append(el('dt', null, k), el('dd', null, v));
  n.querySelector('.c-now-t').textContent = a.now || '…';
}
function elapsedOf(a) {
  if (a.since == null) return '';
  const end = a.until != null ? a.until : (ACTIVE.has(a.status) ? Date.now() : null);
  return end == null ? '' : fmtDur(end - a.since);
}
/* Progress comes only from reports: lead flushes and the agents' own periodic beats.
   No time-based guessing; until the first report the bar is indeterminate. */
function progressOf(a) {
  const known = !ACTIVE.has(a.status) || a.progress > 0;
  return { pct: a.progress, known };
}
function paintProgress(a, n) {
  const pr = progressOf(a), indet = !pr.known;
  const bar = n.querySelector('.bar');
  bar.classList.toggle('indet', indet && !reduced);
  n.querySelector('.bar>i').style.width = (indet ? 0 : pr.pct) + '%';
  const pct = n.querySelector('.c-pct');
  pct.textContent = indet ? '…' : Math.round(pr.pct) + '%';
  const ago = a.progAt != null && ACTIVE.has(a.status) ? Math.round((Date.now() - a.progAt) / 1000) : null;
  pct.title = indet ? '아직 진행률 보고 전' : ago != null ? `${ago}초 전 보고` : '';
  return pr;
}
function updateBands() {
  for (const { b, h } of bandEls) {
    const act = b.items.filter(a => ACTIVE.has(a.status)).length, done = b.items.filter(a => a.status === 'done').length;
    const models = [...new Set(b.items.map(a => a.model).filter(Boolean))].join(', ');
    const parents = [...b.parents].map(id => S.agents.get(id)?.name || id).join(', ');
    const title = h.querySelector('b'); title.replaceChildren();
    title.dataset.role = b.items[0]?.role || 'worker';
    title.append(document.createTextNode(b.team ? 'team ' + b.team : parents + ' 하위'), el('i', null, models ? ' · ' + models : ''));
    h.querySelector('span').textContent = `${parents} → ${b.items.length}명 · 진행 ${act} · 완료 ${done}`;
